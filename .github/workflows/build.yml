name: Build Durilka APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index.html
        run: |
          if [ ! -f index.html ]; then
            echo "::error::Загрузи index.html в корень репозитория"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: |
          rm -rf android
          mkdir -p android/app
          cat > android/app/build.gradle <<'DURILKA_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ru.maxim.durilka'
              compileSdk 34

              defaultConfig {
                  applicationId 'ru.maxim.durilka'
                  minSdk 26
                  targetSdk 32
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          DURILKA_EOF
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml <<'DURILKA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Дурилка"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".AlarmReceiver"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          DURILKA_EOF
          mkdir -p android/app/src/main/java/ru/maxim/durilka
          cat > android/app/src/main/java/ru/maxim/durilka/AlarmReceiver.java <<'DURILKA_EOF'
          package ru.maxim.durilka;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  Notifier.show(context);
              }
          }
          DURILKA_EOF
          mkdir -p android/app/src/main/java/ru/maxim/durilka
          cat > android/app/src/main/java/ru/maxim/durilka/BootReceiver.java <<'DURILKA_EOF'
          package ru.maxim.durilka;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  String action = intent.getAction();
                  if (!Intent.ACTION_BOOT_COMPLETED.equals(action)
                          && !Intent.ACTION_MY_PACKAGE_REPLACED.equals(action)) {
                      return;
                  }
                  if (Notifier.isTargetReached()) {
                      Notifier.show(context);
                  } else {
                      Notifier.schedule(context);
                  }
              }
          }
          DURILKA_EOF
          mkdir -p android/app/src/main/java/ru/maxim/durilka
          cat > android/app/src/main/java/ru/maxim/durilka/MainActivity.java <<'DURILKA_EOF'
          package ru.maxim.durilka;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final String START_URL = "file:///android_asset/index.html";
              private static final String KEY_ASKED_EXACT = "asked_exact";

              private WebView m_web_view;

              @Override
              protected void onCreate(Bundle saved_state) {
                  super.onCreate(saved_state);

                  m_web_view = new WebView(this);
                  m_web_view.setBackgroundColor(0xFF14224A);
                  WebSettings settings = m_web_view.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  m_web_view.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return !request.getUrl().toString().startsWith("file:///android_asset/");
                      }
                  });
                  setContentView(m_web_view);

                  if (saved_state == null || m_web_view.restoreState(saved_state) == null) {
                      m_web_view.loadUrl(START_URL);
                  }

                  Notifier.ensureChannel(this);
                  if (Notifier.isTargetReached()) {
                      Notifier.markShown(this);
                  } else {
                      Notifier.schedule(this);
                      maybeAskExactAlarms();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  m_web_view.onResume();
                  if (!Notifier.isTargetReached()) {
                      Notifier.schedule(this);
                  }
              }

              @Override
              protected void onPause() {
                  m_web_view.onPause();
                  super.onPause();
              }

              @Override
              protected void onSaveInstanceState(Bundle out_state) {
                  super.onSaveInstanceState(out_state);
                  m_web_view.saveState(out_state);
              }

              @Override
              protected void onDestroy() {
                  m_web_view.destroy();
                  super.onDestroy();
              }

              private void maybeAskExactAlarms() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S || Notifier.canScheduleExact(this)) {
                      return;
                  }
                  SharedPreferences prefs = getSharedPreferences("durilka", MODE_PRIVATE);
                  if (prefs.getBoolean(KEY_ASKED_EXACT, false)) {
                      return;
                  }
                  prefs.edit().putBoolean(KEY_ASKED_EXACT, true).apply();
                  new AlertDialog.Builder(this)
                          .setTitle("Одна маленькая просьба")
                          .setMessage("Разреши приложению будильники и напоминания, чтобы уведомление пришло ровно в назначенную минуту.")
                          .setPositiveButton("Разрешить", (d, w) -> {
                              try {
                                  startActivity(new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM,
                                          Uri.parse("package:" + getPackageName())));
                              } catch (ActivityNotFoundException ignored) {
                              }
                          })
                          .setNegativeButton("Потом", null)
                          .show();
              }
          }
          DURILKA_EOF
          mkdir -p android/app/src/main/java/ru/maxim/durilka
          cat > android/app/src/main/java/ru/maxim/durilka/Notifier.java <<'DURILKA_EOF'
          package ru.maxim.durilka;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          final class Notifier {
              // 2026-10-13 01:20 Vladivostok (UTC+10)
              static final long TARGET_MS = 1791818400000L;

              private static final String CHANNEL_ID = "draw";
              private static final String PREFS = "durilka";
              private static final String KEY_SHOWN = "shown";
              private static final int NOTIFICATION_ID = 1;

              private Notifier() {}

              static boolean isTargetReached() {
                  return System.currentTimeMillis() >= TARGET_MS;
              }

              static void ensureChannel(Context context) {
                  NotificationManager nm = context.getSystemService(NotificationManager.class);
                  if (nm == null || nm.getNotificationChannel(CHANNEL_ID) != null) {
                      return;
                  }
                  NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID, "Розыгрыш", NotificationManager.IMPORTANCE_HIGH);
                  channel.setDescription("Уведомление о том, что билет можно открыть");
                  nm.createNotificationChannel(channel);
              }

              static boolean wasShown(Context context) {
                  return prefs(context).getBoolean(KEY_SHOWN, false);
              }

              static void markShown(Context context) {
                  prefs(context).edit().putBoolean(KEY_SHOWN, true).apply();
              }

              static boolean canScheduleExact(Context context) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      return true;
                  }
                  AlarmManager am = context.getSystemService(AlarmManager.class);
                  return am != null && am.canScheduleExactAlarms();
              }

              static void schedule(Context context) {
                  if (isTargetReached() || wasShown(context)) {
                      return;
                  }
                  AlarmManager am = context.getSystemService(AlarmManager.class);
                  if (am == null) {
                      return;
                  }
                  PendingIntent pi = alarmIntent(context);
                  try {
                      if (canScheduleExact(context)) {
                          am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, TARGET_MS, pi);
                      } else {
                          am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, TARGET_MS, pi);
                      }
                  } catch (SecurityException e) {
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, TARGET_MS, pi);
                  }
              }

              static void show(Context context) {
                  if (wasShown(context)) {
                      return;
                  }
                  ensureChannel(context);
                  NotificationManager nm = context.getSystemService(NotificationManager.class);
                  if (nm == null) {
                      return;
                  }
                  Intent open = new Intent(context, MainActivity.class)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent contentIntent = PendingIntent.getActivity(
                          context, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

                  String text = "Розыгрыш состоялся. Твой билет можно открывать";
                  Notification notification = new Notification.Builder(context, CHANNEL_ID)
                          .setSmallIcon(R.drawable.ic_stat_heart)
                          .setColor(0xFFD7263D)
                          .setContentTitle("Диана, время пришло ♡")
                          .setContentText(text)
                          .setStyle(new Notification.BigTextStyle().bigText(text))
                          .setCategory(Notification.CATEGORY_EVENT)
                          .setContentIntent(contentIntent)
                          .setAutoCancel(true)
                          .build();
                  try {
                      nm.notify(NOTIFICATION_ID, notification);
                      markShown(context);
                  } catch (SecurityException ignored) {
                  }
              }

              private static PendingIntent alarmIntent(Context context) {
                  Intent intent = new Intent(context, AlarmReceiver.class);
                  return PendingIntent.getBroadcast(
                          context, 0, intent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              private static SharedPreferences prefs(Context context) {
                  return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }
          }
          DURILKA_EOF
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher_fg.xml <<'DURILKA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:scaleX="2.2"
                  android:scaleY="2.2"
                  android:translateX="27.6"
                  android:translateY="25.4">
                  <path
                      android:fillColor="#FFD7263D"
                      android:pathData="M12,21S4.5,16.4 2.4,11.8C1,8.6 3,5 6.5,5C8.5,5 10,6.2 12,8.3C14,6.2 15.5,5 17.5,5C21,5 23,8.6 21.6,11.8C19.5,16.4 12,21 12,21Z" />
              </group>
          </vector>
          DURILKA_EOF
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_heart.xml <<'DURILKA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,21S4.5,16.4 2.4,11.8C1,8.6 3,5 6.5,5C8.5,5 10,6.2 12,8.3C14,6.2 15.5,5 17.5,5C21,5 23,8.6 21.6,11.8C19.5,16.4 12,21 12,21Z" />
          </vector>
          DURILKA_EOF
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'DURILKA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          DURILKA_EOF
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/colors.xml <<'DURILKA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#FF14224A</color>
          </resources>
          DURILKA_EOF
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml <<'DURILKA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
              </style>
          </resources>
          DURILKA_EOF
          mkdir -p android
          cat > android/build.gradle <<'DURILKA_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          DURILKA_EOF
          mkdir -p android
          cat > android/gradle.properties <<'DURILKA_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          DURILKA_EOF
          mkdir -p android
          cat > android/settings.gradle <<'DURILKA_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Durilka"
          include ':app'
          DURILKA_EOF
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Durilka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Durilka-apk
          path: Durilka.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Durilka.apk --title "Дурилка" --notes "Скачай Durilka.apk и установи на телефон"
